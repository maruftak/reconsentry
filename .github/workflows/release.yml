name: release

on:
  push:
    tags:
      # Full semver only. Moving major tags (e.g. v1, used by the GitHub Action)
      # must not trigger a goreleaser run.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: add a HOMEBREW_TAP_GITHUB_TOKEN repo secret (a PAT with write
          # access to maruftak/homebrew-tap) to publish the Homebrew formula.
          # Without it, BREW_SKIP_UPLOAD=true so the formula is built but not
          # pushed — releases never fail for lack of the tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || github.token }}
          BREW_SKIP_UPLOAD: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN == '' }}
